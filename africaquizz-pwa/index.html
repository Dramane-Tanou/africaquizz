<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFBB02" />
    <meta name="description" content="Africa Quizz — Joue. Apprends. Découvre l'Afrique." />
    <title>Africa Quizz</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash clair/sombre.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("aq.settings") || "{}");
          var t = s.theme || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
